name: triage-automation

on:
  workflow_dispatch:
    inputs:
      event_type:
        description: Automation event to verify
        required: true
        type: choice
        default: triage.issue
        options:
          - triage.issue
          - triage.pull_request
      dry_run:
        description: Verify delivery without starting the automation agent
        required: true
        type: boolean
        default: true
  issues:
    types: [opened, edited, reopened, labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  triage:
    # This workflow delivers repository data to the upstream project's private
    # automation bridge. Forks do not own those secrets and must not fail their
    # pull requests merely because the upstream-only integration is unavailable.
    if: github.repository == 'perfect-panel/frontend' && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request_target' || github.event.issue.state == 'open')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Collect triage context
        env:
          TRIAGE_TOKEN: ${{ secrets.TRIAGE_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/triage-context.mjs

      - name: Send webhook to bridge
        env:
          AUTOMATION_WEBHOOK_URL: ${{ secrets.AUTOMATION_WEBHOOK_URL }}
          AUTOMATION_WEBHOOK_SECRET: ${{ secrets.AUTOMATION_WEBHOOK_SECRET }}
          AUTOMATION_EVENT_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.event_type || '' }}
          AUTOMATION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action || '' }}
          GITHUB_DELIVERY: ${{ github.run_id }}-${{ github.run_attempt }}
          WEBHOOK_RETRY_DELAY_MS: "1000"
        run: node scripts/triage-webhook.mjs
