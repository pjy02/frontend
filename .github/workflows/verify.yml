name: Verify frontend

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Keep the runner on a distribution supported by the pinned Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.1'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: node --test scripts/*.test.mjs
      - run: node scripts/prepare-release.mjs
      - run: bun x --no-install playwright-core install --with-deps chromium
      - run: node scripts/check-release-smoke.mjs
