<!DOCTYPE html>
<html lang="en-US" translate="no">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicons -->
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico"> -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest">
    <meta
      name="theme-color"
      content="#F8FAFD"
      media="(prefers-color-scheme: light)"
    >
    <meta
      name="theme-color"
      content="#111315"
      media="(prefers-color-scheme: dark)"
    >

    <!-- The app ships its own i18n; browser page translation rewrites DOM
         text nodes and crashes React (see issue #139) -->
    <meta name="google" content="notranslate">

    <!-- SEO -->
    <meta name="description" content="Loading...">
    <meta name="keywords" content="">

    <title>Loading...</title>

    <!-- Apply the saved theme before first paint to avoid a white flash in dark mode -->
    <script>
    "use strict";
    (() => {
      try {
        const match = document.cookie.match(/(?:^|;\s*)theme=([^;]*)/);
        const theme = match ? decodeURIComponent(match[1]) : "system";
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {
        /* noop */
      }
    })();
    </script>

    <!-- Splash screen shown until React commits its first content into #app -->
    <style>
    html {
      background-color: #f8fafd;
    }
    html.dark {
      background-color: #111315;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #app:not(:empty) ~ #splash {
      display: none;
    }
    #splash .spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid #e3e7ed;
      border-top-color: #4285f4;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    html.dark #splash .spinner {
      border-color: #303134;
      border-top-color: #8ab4f8;
    }
    @keyframes splash-spin {
      to {
        transform: rotate(360deg);
      }
    }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash">
      <div class="spinner"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
